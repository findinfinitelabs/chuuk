[pytest]
# ---------------------------------------------------------------------------
# Chuuk Dictionary — pytest configuration
# ---------------------------------------------------------------------------

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -q

# Custom markers
markers =
    unit: Pure unit tests — no I/O or network
    integration: Tests that require a real database or network
    translation: Tests that exercise the Helsinki-NLP translation pipeline
    slow: Tests expected to take > 5 seconds

# Suppress noisy warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:transformers.*
    ignore::DeprecationWarning:torch.*
    ignore::UserWarning:torch.*
    ignore::FutureWarning:transformers.*
