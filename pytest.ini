[pytest]
# ---------------------------------------------------------------------------
# Chuuk Dictionary — pytest configuration
# ---------------------------------------------------------------------------

# Test discovery
# testpaths keeps normal `pytest` runs inside tests/; norecursedirs makes an
# explicit `pytest .` safe too, since scripts/debug/ contains run-by-hand
# scripts that hit a live database at import time.
testpaths = tests
norecursedirs = scripts .git .venv node_modules frontend models uploads output training_data config
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -q

# Custom markers
markers =
    unit: Pure unit tests — no I/O or network
    integration: Tests that require a real database or network
    translation: Tests that exercise the Helsinki-NLP translation pipeline
    slow: Tests expected to take > 5 seconds

# Suppress noisy warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:transformers.*
    ignore::DeprecationWarning:torch.*
    ignore::UserWarning:torch.*
    ignore::FutureWarning:transformers.*
